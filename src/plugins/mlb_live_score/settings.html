<div class="form-group">
    <label class="form-label">Display:</label>
    <div class="form-group">
        <input type="hidden" id="showOutsValue" name="showOuts" value="true">
        <input type="checkbox" id="showOuts" checked
               onclick="document.getElementById('showOutsValue').value=this.checked ? 'true' : 'false';">
        <label for="showOuts">Show outs</label>
    </div>
    <div class="form-group">
        <input type="hidden" id="showLastUpdatedValue" name="showLastUpdated" value="false">
        <input type="checkbox" id="showLastUpdated"
               onclick="document.getElementById('showLastUpdatedValue').value=this.checked ? 'true' : 'false';">
        <label for="showLastUpdated">Show last-updated time</label>
    </div>
</div>

<p>No API key is required. A 5–10 minute refresh interval is recommended during games.</p>

<script>
document.addEventListener('DOMContentLoaded', () => {
    if (!loadPluginSettings) return;

    document.getElementById('mlbTeamId').value = String(pluginSettings.mlbTeamId || '144');

    const showOuts = pluginSettings.showOuts === undefined
        ? true
        : String(pluginSettings.showOuts) === 'true';
    const showUpdated = String(pluginSettings.showLastUpdated || 'false') === 'true';

    document.getElementById('showOuts').checked = showOuts;
    document.getElementById('showOutsValue').value = showOuts ? 'true' : 'false';
    document.getElementById('showLastUpdated').checked = showUpdated;
    document.getElementById('showLastUpdatedValue').value = showUpdated ? 'true' : 'false';
});
</script>
